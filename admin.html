<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кенгуру · Admin</title><link rel="stylesheet" href="/static/style.css"><style>.adminWrap{padding:50px 0}.adminTop{display:grid;grid-template-columns:1fr auto;gap:12px}.adminTable{width:100%;border-collapse:collapse;font-size:13px}.adminTable th,.adminTable td{padding:12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.adminTable th{background:#f6f9fb;position:sticky;top:0}.tableBox{overflow:auto;max-height:65vh}.tag{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef4f8;font-weight:800}.actions{display:flex;gap:6px}.actions .btn{padding:8px 10px;font-size:12px}@media(max-width:600px){.adminTop{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="wrap navrow"><a class="brand" href="/"><img src="/static/logo.jpg"><span><b>КЕНГУРУ</b><small>Organizer panel</small></span></a><a class="btn secondary" href="/">← Сайт</a></div></header><main class="adminWrap"><div class="wrap"><div class="sectionHead"><div><div class="eyebrow dark">ADMIN</div><h2>Ұйымдастырушы панелі</h2></div><p>Төлемді растау, қатысушылар мен нәтижелерді көру. Production серверінде міндетті түрде жеке пароль орнатыңыз.</p></div><div class="panel"><div class="adminTop"><input id="pw" type="password" placeholder="Admin password"><button class="btn primary" onclick="loadList()">Кіру / жаңарту</button></div></div><div class="panel tableBox" style="margin-top:16px"><table class="adminTable"><thead><tr><th>ID</th><th>Оқушы</th><th>Сынып</th><th>Телефон</th><th>Мектеп</th><th>Төлем</th><th>Нәтиже</th><th>Диплом</th><th>Әрекет</th></tr></thead><tbody id="rows"><tr><td colspan="9">Парольді енгізіңіз.</td></tr></tbody></table></div></div></main><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function loadList(){let r=await fetch('/api/admin/list?password='+encodeURIComponent(pw.value));if(!r.ok){alert('Пароль қате / неверный пароль');return}let a=await r.json();rows.innerHTML=a.map(x=>`<tr><td>${x.id}</td><td><b>${E(x.full_name)}</b><br><small>${E(x.region)}, ${E(x.locality)}</small></td><td>${x.grade}</td><td>${E(x.phone)}</td><td>${E(x.school)}</td><td><span class="tag">${E(x.payment_status)}</span></td><td>${x.score??'—'} ${E(x.award||'')}</td><td>${E(x.diploma_no||'—')}</td><td><div class="actions">${x.payment_status!=='paid'?`<button class="btn primary" onclick="act('${x.token}','approve')">Растау</button>`:''}${x.payment_status==='pending'?`<button class="btn secondary" onclick="act('${x.token}','reject')">Қайтару</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="9">Қатысушы жоқ</td></tr>'}async function act(token,action){let r=await fetch('/api/admin/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value,token,action})});if(r.ok)loadList();else alert('Қате')}</script></body></html>
